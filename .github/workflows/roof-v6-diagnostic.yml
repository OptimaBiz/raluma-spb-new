name: Roof V7 asset diagnostic

on:
  pull_request:
    paths:
      - 'public/images/pergolas/roof-*.jpg'
      - 'src/components/ui/PergolaRoofPhotosV7.astro'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/roof-v6-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'public/images/pergolas/roof-*.jpg'
      - 'src/components/ui/PergolaRoofPhotosV7.astro'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/roof-v6-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roof-v7-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --quiet pillow

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Verify V7 markup
        run: |
          test -f dist/pergolas/index.html
          grep -q 'PergolaRoofPhotosV7' dist/pergolas/index.html
          grep -q 'data-roof-photo-v7' dist/pergolas/index.html
          grep -q 'roof-closed.jpg?v=7' dist/pergolas/index.html
          grep -q 'roof-half-open.jpg?v=7' dist/pergolas/index.html
          grep -q 'roof-open.jpg?v=7' dist/pergolas/index.html

      - name: Verify V7 image pixels
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          paths = [
              Path('public/images/pergolas/roof-closed.jpg'),
              Path('public/images/pergolas/roof-half-open.jpg'),
              Path('public/images/pergolas/roof-open.jpg'),
          ]
          images = []
          for path in paths:
              with Image.open(path) as source:
                  source.load()
                  image = source.convert('RGB')
              if image.width < 480 or image.height < 300:
                  raise SystemExit(f'{path.name}: invalid size {image.size}')
              gray = image.convert('L')
              low, high = gray.getextrema()
              stats = ImageStat.Stat(gray)
              mean = float(stats.mean[0])
              deviation = float(stats.stddev[0])
              if high - low < 18 or deviation < 5 or mean < 8:
                  raise SystemExit(
                      f'{path.name}: blank/dark pixels range={low}..{high}, '
                      f'mean={mean:.2f}, stddev={deviation:.2f}'
                  )
              images.append(image.resize((480, 312)))

          for left in range(len(images)):
              for right in range(left + 1, len(images)):
                  difference = ImageChops.difference(images[left], images[right])
                  rms = sum(ImageStat.Stat(difference).rms) / 3
                  if rms < 4:
                      raise SystemExit(
                          f'roof modes {left + 1} and {right + 1} look identical: rms={rms:.2f}'
                      )

          print('V7 roof photos decode, contain visible pixels, and differ from one another')
          PY
